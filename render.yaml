services:
  # 1. Django Backend
  - type: web
    name: civic-backend
    plan: free
    env: python
    region: ohio
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: civic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: civic-redis
          property: connectionString

  # 2. Angular Frontend
  - type: web
    name: civic-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist/civic-issue-reporting/browser"

  # 3. Redis (for WebSockets/Notifications)
  - type: redis
    name: civic-redis
    plan: free
    region: ohio
    ipAllowList: [] # empty means allow all traffic internally

databases:
  - name: civic-db
    plan: free
    region: ohio
    databaseName: civic
    user: civic
