services:
  - type: web
    name: civic-backend
    env: python
    region: ohio
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn config.wsgi
    envVars:
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: civic-db
          property: connectionString

databases:
  - name: civic-db
    databaseName: civic
    user: civic
